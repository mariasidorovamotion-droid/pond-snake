.card-sound { display: grid; gap: 10px; width: 100%; max-width: 400px; margin: 0 auto; }
.snd { padding: 10px 16px 10px; background: rgba(246,232,206,.55); border: 2px solid rgba(224,203,165,.55); border-radius: 18px; }
.snd-head { display: flex; align-items: center; gap: 10px; color: var(--ink); }

.snd-lbl { margin-top: 6px; font-size: 15px; font-weight: 700; } .snd-lbl b { font-weight: 900; font-size: 16px; }
.snd-scale { font-size: 12px; font-weight: 800; opacity: .75; margin-top: -2px; }
.snd-vol { display: flex; align-items: center; gap: 14px; margin-top: 6px; } .snd-vol .pct { min-width: 3.4ch; text-align: right; font-size: 18px; font-weight: 900; color: var(--ink); }
.snd-vol input[type=range] { flex: 1; min-width: 0; width: 100%; -webkit-appearance: none; appearance: none; height: 30px; background: none; margin: 0; }
.snd-vol input[type=range]::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #ffd12a 0, #f6b31f var(--fill), #e9dcc3 var(--fill)); box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
.snd-vol input[type=range]::-moz-range-track { height: 14px; border-radius: 7px; background: #e9dcc3; }
.snd-vol input[type=range]::-moz-range-progress { height: 14px; border-radius: 7px; background: #f6b31f; }
.snd-vol input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -8px; border-radius: 50%; background: linear-gradient(#fff, #f1ebe0); border: 1px solid #dccfb4; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.snd-vol input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #dccfb4; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.snd-vol input[type=range]:disabled { opacity: .4; }
.switch { position: relative; width: 104px; height: 36px; flex: none; border: 0; border-radius: 18px; padding: 0; cursor: pointer;
  background: linear-gradient(#7fd63a, #4fae1c); box-shadow: inset 0 2px 3px rgba(0,0,0,.18), 0 2px 0 #3d8a12; transition: background .2s; }
.switch em { position: absolute; left: 6px; width: 62px; text-align: center; top: 0; line-height: 36px; font: 900 14px/36px inherit; font-family: inherit; font-style: normal; color: #fff; letter-spacing: .04em; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
.switch i { position: absolute; top: 4px; left: 72px; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(#fff, #f1ebe0); box-shadow: 0 2px 3px rgba(0,0,0,.25); transition: left .2s; }
.switch[aria-pressed="false"] { background: #cdbf9f; box-shadow: inset 0 2px 3px rgba(0,0,0,.18), 0 2px 0 #b3a37f; } .switch[aria-pressed="false"] i { left: 4px; } .switch[aria-pressed="false"] em { left: 36px; width: 62px; font-size: 13px; color: #6b5d43; text-shadow: none; } /* текст по центру свободной части */
#exitBtn.btn-blue { --hi: #2fb2d6; --base: #1590b8; --edge: #0d6a8a; }
@media (max-height: 760px) { .snd-scale { display: none; } .snd { padding: 7px 12px 4px; } .card-sound { gap: 6px; } }
@media (max-height: 640px) { .snd-lbl { display: none; } .snd-head b { font-size: 17px; } .switch { transform: scale(.85); transform-origin: left center; margin-right: -16px; } body.mobile .switch { transform: none; margin-right: 0; } .snd-vol input[type=range] { height: 24px; } .snd { padding: 4px 10px 2px; } }
@media (max-width: 360px) { body.mobile .snd { padding: 4px 8px 2px !important; } body.mobile .snd-vol { gap: 6px; } body.mobile .switch { width: 76px !important; } body.mobile .switch i { left: 48px; } body.mobile .switch em { width: 46px; } body.mobile .switch[aria-pressed="false"] em { left: 28px; width: 46px; font-size: 11px; } body.mobile .snd-vol .pct { font-size: 13px; } }
body.mobile .snd-lbl { display: none; } body.mobile .snd-scale { display: none; } body.mobile .snd-head b { font-size: 17px; }
body.mobile .switch, body.mobile .switch[aria-pressed] { transform: none; margin: 0; width: 86px; height: 32px; } body.mobile .switch i { width: 24px; height: 24px; left: 58px; } body.mobile .switch[aria-pressed="false"] i { left: 4px; } body.mobile .switch em { line-height: 32px; width: 54px; left: 4px; font-size: 13px; } body.mobile .switch[aria-pressed="false"] em { left: 30px; width: 54px; font-size: 12px; } body.mobile .snd-vol .pct { font-size: 15px; } body.mobile .snd-vol { gap: 10px; margin-top: 2px; } body.mobile .snd { padding: 5px 10px 2px; } body.mobile .card-sound { gap: 6px; }
.card-x { position: absolute; top: 12px; right: 12px; z-index: 2; width: 42px; height: 42px; border-radius: 50%; border: 2px solid #e3cfa6;
  background: linear-gradient(#fffaf0, #f5e8cc); color: var(--ink); font: 900 20px/1 inherit; font-family: inherit; box-shadow: 0 3px 0 #dcc59a; cursor: pointer; }
#ovTitle { padding-inline: 40px; }
body.mobile #ovTitle { padding-inline: 26px; font-size: clamp(19px, 6.3vw, 32px); white-space: nowrap; }
body.mobile #ovSad { width: clamp(56px, 9vh, 96px); }
body.mobile .card-x { width: 34px; height: 34px; top: 8px; right: 8px; font-size: 16px; }
@media (max-height: 470px) { body.mobile #ovTitle { font-size: 22px; } body.mobile .snd { padding: 2px 10px 0; } .snd-vol input[type=range] { height: 20px; } body.mobile .card-sound { gap: 4px; } }
#ovText.sad { font-weight: 900; font-size: clamp(17px, 2.6vh, 22px); opacity: 1; }
.card .big canvas { width: 1.6em; height: 1.4em; margin: -.1em 0; }   /* лягушка по высоте цифры */
button {
  font: inherit; cursor: pointer; border: 0;
  touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 0 22px;
  border-radius: 18px;
  font-size: 20px; font-weight: 900;
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); }
.btn svg { width: 24px; height: 24px; flex: none; }
/* Объёмные «игровые» кнопки: светлый верх, мягкий блик, тёмная кромка снизу, белый текст с тенью */
.btn { --hi: #fff; --base: #ccc; --edge: #999; position: relative;
  background: linear-gradient(180deg, var(--hi) 0%, var(--base) 58%, var(--base) 100%);
  border: 2px solid var(--edge);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.08), 0 5px 0 var(--edge), 0 9px 16px rgba(0,0,0,.22);
  text-shadow: 0 2px 0 rgba(0,0,0,.22); color: #fff; }
.btn:active { box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 var(--edge), 0 3px 8px rgba(0,0,0,.2); }
.btn-green { --hi: var(--green-hi); --base: var(--green); --edge: var(--green-edge); }
.btn-blue { --hi: var(--blue-hi); --base: var(--blue); --edge: var(--blue-edge); }
.btn-coral { --hi: #ff9a6b; --base: var(--coral); --edge: var(--coral-edge); }
.btn-teal { --hi: #4fb7ae; --base: var(--teal-btn); --edge: var(--teal-btn-edge); }
.btn-cream { --hi: #fffaf0; --base: #f6e9cd; --edge: var(--cream-edge); color: var(--ink); text-shadow: none; }
.btn-icon { padding: 0; width: 64px; }
a.btn { text-decoration: none; }
.card .btn { width: 100%; max-width: 260px; box-sizing: border-box; }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: nowrap; width: 100%; }
.row .btn { flex: 0 1 auto; }
.hint {
  background: none; border: 0; font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 10px;
  margin: 0; white-space: nowrap; font-size: 14px; font-weight: 800; font-style: italic; color: var(--muted);
  display: flex; align-items: center; gap: 12px;
}
.hint::before, .hint::after { content: ""; width: 40px; height: 2px; background: currentColor; opacity: .5; border-radius: 2px; }
/* панель звука */
.panel { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 8%; touch-action: auto; }
.settings { gap: 14px; color-scheme: light; }
.set-row { width: 100%; display: flex; align-items: center; gap: 12px; }
.tog {
  flex: none; min-width: 118px; min-height: 48px; padding: 0 14px;
  border-radius: 14px; font-size: 16px; font-weight: 900;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  background: var(--teal-btn); color: var(--cream); box-shadow: 0 3px 0 var(--teal-btn-edge);
}
.tog[aria-pressed="false"] { background: var(--cream-edge); color: var(--ink); box-shadow: 0 3px 0 #b9a77e; opacity: .8; }
.tog.wide { flex: 1; }
.set-row input[type=range] {
  flex: 1; min-width: 0; height: 36px; margin: 0; background: transparent; touch-action: pan-x;
  -webkit-appearance: none; appearance: none; --fill: 50%;
}
.set-row input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--coral) var(--fill), var(--cream-edge) var(--fill)); }
.set-row input[type=range]::-moz-range-track { height: 12px; border-radius: 6px; background: var(--cream-edge); }
.set-row input[type=range]::-moz-range-progress { height: 12px; border-radius: 6px; background: var(--coral); }
.set-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -8px; border-radius: 50%; background: var(--cream); border: 4px solid var(--coral); box-shadow: 0 2px 4px rgba(20,60,60,.25); }
.set-row input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--cream); border: 4px solid var(--coral); }
.set-row input[type=range]:disabled { opacity: .35; }
/* стрелки на экране */
.dpad { display: grid; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(2, 62px); gap: 8px; }
.dpad button { border-radius: 16px; background: linear-gradient(180deg, #fffaf0, #f3e4c6); color: var(--ink); font-size: 26px; border: 2px solid var(--cream-edge); box-shadow: 0 4px 0 var(--cream-edge), 0 6px 12px rgba(0,0,0,.16); touch-action: none; }   /* стрелки — нейтральные кремовые: это управление, а не действие */
.dpad button:active, .dpad button.hit { transform: translateY(2px); box-shadow: 0 1px 0 var(--cream-edge); background: var(--coral); color: #fff; border-color: var(--coral-edge); }
.dpad .up { grid-column: 2; grid-row: 1; } .dpad .left { grid-column: 1; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 2; } .dpad .right { grid-column: 3; grid-row: 2; }
body.dpad-on .board { width: min(100%, calc(100dvh - 360px)); }
body.dpad-on .hint { display: none; }
.modes { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modes .tog { min-width: 0; width: 100%; }
.tapzone { position: fixed; top: 0; bottom: 0; width: 50%; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(60% 50% at 50% 50%, rgba(255,255,255,.22), transparent 70%); }
.tapzone.l { left: 0; } .tapzone.r { right: 0; }
.tapzone.on { opacity: 1; transition: none; }
@media (prefers-reduced-motion: reduce) { .tapzone { transition: none; } }
@media (max-width: 400px) {
  .btn { padding: 0 16px; font-size: 17px; min-height: 52px; }
  .btn-icon { width: 54px; padding: 0; }
  .pill b { font-size: 20px; }
}
@media (max-height: 600px) { .hint { display: none; } .dpad { grid-template-rows: repeat(2, 50px); } .board { width: min(100%, calc(100dvh - 170px)); } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* ===== Компьютер, узкое окно: та же колонка, но всё крупнее ===== */
body:not(.mobile) .app { max-width: min(100%, 900px); }
body:not(.mobile) .title { font-size: clamp(30px, 5.2vh, 52px); }
body:not(.mobile) .pill { padding: 6px 16px 6px 10px; border-radius: 18px; }

body:not(.mobile) .pill b { font-size: clamp(24px, 3.6vh, 36px); }
body:not(.mobile) .row .btn { min-height: clamp(56px, 7vh, 72px); font-size: clamp(18px, 2.6vh, 26px); border-radius: 20px; }

/* ===== Компьютер, широкое окно (класс body.wide): пруд на всю высоту справа, колонка с плашками и кнопками слева ===== */
body.wide { padding-block: clamp(12px, 2.2vh, 28px); }
body.wide .app {
  max-width: none; height: 100%; display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(240px, 21vw, 360px);
  grid-template-rows: minmax(0, 1fr) auto auto auto auto minmax(0, 1fr);
  grid-template-areas: "board ." "board top" "board btns" "board pad" "board hint" "board .";
  column-gap: clamp(20px, 3vw, 56px); row-gap: clamp(14px, 2.4vh, 26px); align-items: start;
}
body.wide .top { grid-area: top; flex-direction: column; align-items: stretch; gap: clamp(8px, 1.4vh, 18px); }
body.wide .title { justify-content: center; font-size: clamp(36px, 6.6vh, 70px); }
body.wide .title svg:last-child { display: none; }
body.wide .pills { flex-direction: column; gap: clamp(8px, 1.4vh, 18px); }

body.wide .pill .ic { width: clamp(42px, 7vh, 70px); }
body.wide .pill small { font-size: clamp(11px, 1.7vh, 17px); }

/* ===== Мобильная раскладка: включается сама на телефонах (класс body.mobile) =====

body.mobile {

  --plate: clamp(46px, 6.5dvh, 60px);

  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
  grid-template-areas: "top" "fx" "board" "pad" "btns" "hint";
}
body.mobile .top { grid-area: top; width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

}

body.mobile .pill { min-height: var(--plate); justify-content: center; gap: 4px; padding: 3px 6px; border-radius: 16px; box-shadow: 0 4px 0 var(--cream-edge), 0 8px 16px rgba(0,0,0,.2); }
body.mobile .pill .ic { width: clamp(24px, 9vw, 40px); height: auto; aspect-ratio: 34 / 30; }
body.mobile .pill small { font-size: clamp(9px, 2.8vw, 13px); }

body.mobile .row { grid-area: btns; width: 100%; display: grid; grid-template-columns: 1fr 1.15fr .6fr; gap: 10px; }
body.mobile .row .btn { width: 100%; min-height: var(--plate); padding: 0 6px; gap: 8px; border-radius: 18px; font-size: clamp(17px, 5.4vw, 24px); }

body.mobile .dpad button { font-size: clamp(24px, 8vw, 38px); border-radius: 20px; }

}
/* телефон боком: пруд справа во всю высоту, всё остальное колонкой слева */
body.mobile.landscape { --padcol: 46px; --padrow: 40px; --plate: 44px; padding: 0 !important; height: 100dvh; overflow: hidden; }

  grid-template-columns: minmax(0, 1fr) clamp(170px, 27vw, 320px); grid-template-rows: minmax(0, 1fr) auto auto auto auto auto minmax(0, 1fr);
  grid-template-areas: "board ." "board top" "board fx" "board btns" "board pad" "board hint" "board ."; }   /* панель справа по центру: лого, счёт, кнопки, подсказка (макет Совы) */
body.mobile.landscape .board, body.mobile.landscape.dpad-on .board { width: 100%; height: 100%; max-width: none; }

.pack { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 18px; border: 2px solid var(--cream-edge); background: linear-gradient(180deg, #fffaf0, #f6e9cd); box-shadow: 0 4px 0 var(--cream-edge), 0 8px 14px rgba(0,0,0,.14); font: inherit; color: var(--ink); cursor: pointer; }

/* =========================================================
   ПЛОЩАДКА (v0.67–v0.68, 2026-11-05, Claude для Совы)
   Один код на все площадки. Сборка tools/build.py подставляет BUILD и скрипт SDK.
   Что здесь: хранилище с заменяемым бэкендом, язык, «Поделиться», события
   «игра идёт / пауза», запуск игрового кода после загрузки сохранений.
   Игровой код лежит ниже в <script type="text/plain" id="ps-game"> и запускается
   функцией PS.start() после того, как хранилище прочитано.
   ========================================================= */
const BUILD = { platform: 'telegram', lang: 'ru', version: '0.68' };

const PS = (() => {
  const KEYS = ['run', 'coins', 'best', 'audio', 'dpad', 'control', 'size', 'pending', 'migrated'].map(k => 'pondsnake.' + k + '.v1');
  const cache = {};           // всё, что знает игра о сохранениях, живёт здесь; get() мгновенный
  const pauseCbs = [], resumeCbs = [];
  let playing = false, lang = 'ru';

  /* ---- localStorage: всегда есть как запасной слой; каждое обращение в try/catch ---- */
  const local = {
    read(k) { try { const v = localStorage.getItem(k); return v === null ? undefined : JSON.parse(v); } catch (e) { return undefined; } },
    write(k, v) { try { if (v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ---- адаптеры площадок. У каждого: init(), load() → {k: v}, write(k, v), flush(), ready(), share({text,url}), canShare, gameplay(on) ---- */
  const base = {
    async init() {},
    async load() { const o = {}; KEYS.forEach(k => { const v = local.read(k); if (v !== undefined) o[k] = v; }); return o; },
    write(k, v) { local.write(k, v); },
    flush() {},
    ready() {},
    canShare() { return !!navigator.share; },
    share({ text, url }) { try { navigator.share(url ? { text, url } : { text }).catch(() => {}); } catch (e) {} },
    gameplay(on) {},
    lang() { return null; },
  };

  const adapters = {};
  adapters.web = Object.assign({}, base);

  /* Telegram: хранилище браузера, «Поделиться» через t.me/share, как в v0.66 */
  adapters.telegram = Object.assign({}, base, {
    canShare() { return true; },
    share({ text, url }) {
      const T = window.Telegram && window.Telegram.WebApp;
      const link = 'https://t.me/share/url?url=' + encodeURIComponent(url || location.href.split('#')[0]) + '&text=' + encodeURIComponent(text);
      try { if (T && T.openTelegramLink) T.openTelegramLink(link); else window.open(link, '_blank', 'noopener'); } catch (e) {}
    },
  });

  /* Facebook Instant Games (Zero Permissions, SDK 8.0): сохранения в FBInstant.player, запасной слой localStorage.
     Цикл: initializeAsync → setLoadingProgress → (игра готова) → startGameAsync. */
  adapters.facebook = Object.assign({}, base, {
    fb: null, dirty: {}, timer: null,
    async init() {
      const F = window.FBInstant; if (!F) return;
      await F.initializeAsync(); this.fb = F; F.setLoadingProgress(60);
      try { F.onPause(() => api._pause()); } catch (e) {}   // площадка свернула игру (звонок, другая вкладка)
    },
    async load() {
      const o = await base.load();                              // сначала то, что есть в браузере
      if (!this.fb) return o;
      try { const d = await this.fb.player.getDataAsync(KEYS); KEYS.forEach(k => { if (d[k] !== undefined && d[k] !== null) o[k] = d[k]; }); } catch (e) {}
      this.fb.setLoadingProgress(100);
      return o;
    },
    write(k, v) {
      local.write(k, v);
      if (!this.fb) return;
      this.dirty[k] = v === undefined ? null : v;
      clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800);   // не чаще раза в секунду
    },
    flush(hard) {
      clearTimeout(this.timer); this.timer = null;
      const d = this.dirty; this.dirty = {};
      if (!this.fb || !Object.keys(d).length) return;
      try { const p = this.fb.player.setDataAsync(d); if (hard) p.then(() => this.fb.player.flushDataAsync()).catch(() => {}); else p.catch(() => {}); } catch (e) {}
    },
    ready() { if (this.fb) this.fb.startGameAsync().catch(() => {}); },
    canShare() { return !!this.fb; },
    share({ text }) { try { this.fb.shareAsync({ intent: 'SHARE', text }).catch(() => {}); } catch (e) {} },
    lang() { try { const l = this.fb && this.fb.getLocale(); return l ? l.slice(0, 2) : null; } catch (e) { return null; } },
  });

  /* VK (игры ВКонтакте, VK Bridge встроен в файл сборкой): рекорд, копилка, настройки — в VKWebAppStorage
     (ключ ≤ 100 знаков из a-z 0-9 _ -, значение ≤ 4096 байт, до 1000 ключей); сохранённая партия больше 4 КБ —
     только в localStorage. Язык из параметра запуска vk_language. Пауза по VKWebAppViewHide/Restore. */
  adapters.vk = Object.assign({}, base, {
    br: null, dirty: {}, timer: null,
    vkKey(k) { return k.replace(/[^a-zA-Z0-9_-]/g, '_'); },
    cloudKeys() { return KEYS.filter(k => !/\.run\./.test(k)); },
    async init() {
      const B = window.vkBridge; if (!B) return;
      this.br = B;
      try { await B.send('VKWebAppInit', {}); } catch (e) {}
      B.subscribe(ev => {
        const t = ev && ev.detail && ev.detail.type;
        if (t === 'VKWebAppViewHide') api._pause(); else if (t === 'VKWebAppViewRestore') api._resume();
      });
    },
    async load() {
      const o = await base.load();
      if (!this.br) return o;
      try {
        const keys = this.cloudKeys();
        const r = await this.br.send('VKWebAppStorageGet', { keys: keys.map(k => this.vkKey(k)) });
        (r.keys || []).forEach(({ key, value }) => {
          if (!value) return;
          const k = keys.find(x => this.vkKey(x) === key); if (!k) return;
          try { o[k] = JSON.parse(value); } catch (e) {}
        });
      } catch (e) {}
      return o;
    },
    write(k, v) {
      local.write(k, v);
      if (!this.br || /\.run\./.test(k)) return;
      this.dirty[k] = v === undefined ? '' : JSON.stringify(v);
      clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800);
    },
    flush() {
      clearTimeout(this.timer); this.timer = null;
      const d = this.dirty; this.dirty = {};
      if (!this.br) return;
      Object.keys(d).forEach(k => { if (d[k].length <= 4000) this.br.send('VKWebAppStorageSet', { key: this.vkKey(k), value: d[k] }).catch(() => {}); });
    },
    canShare() { return !!this.br; },
    share() { try { this.br.send('VKWebAppShare', {}).catch(() => {}); } catch (e) {} },   // без link — ссылка на саму игру
    lang() { const m = /[?&]vk_language=([a-z]+)/.exec(location.search); return m ? m[1] : null; },
  });

  /* ---- общее ---- */
  const A = () => adapters[BUILD.platform] || adapters.web;

  function resolveLang() {
    if (BUILD.lang === 'ru' || BUILD.lang === 'en') return BUILD.lang;
    const m = /[?&#]lang=(ru|en)/.exec(location.search + location.hash); if (m) return m[1];
    const fromSdk = A().lang && A().lang();
    const l = (fromSdk || navigator.language || 'en').toLowerCase();
    return /^(ru|be|uk|kk)/.test(l) ? 'ru' : 'en';   // русский и соседние — русская версия, остальным английская
  }

  function translate(text) {
    if (lang !== 'en') return text;
    for (const [ru, en] of I18N_EN) text = text.split(ru).join(en);
    return text;
  }

  /* Значения хранятся как снимки (копия через JSON), как это было бы в localStorage:
     игра может дальше менять свой объект, а сохранённая партия не поедет вслед за ним. */
  const snap = v => (v !== null && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v;
  const store = {
    get(k, d) { return k in cache ? snap(cache[k]) : d; },
    set(k, v) { cache[k] = snap(v); A().write(k, cache[k]); },
    remove(k) { delete cache[k]; A().write(k, undefined); },
  };

  async function start() {
    const a = A();
    const within = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ': нет ответа ' + ms + ' мс')), ms))]);
    try { await within(a.init(), 4000, 'SDK init'); } catch (e) { console.warn(e); a.fb = null; a.br = null; }   // SDK не ответил — игра идёт на localStorage
    lang = resolveLang();
    let loaded = {};
    try { loaded = await within(a.load(), 4000, 'SDK load'); } catch (e) { console.warn(e); loaded = await base.load(); }
    Object.assign(cache, loaded);
    document.documentElement.lang = lang;
    if (lang === 'en') { document.title = 'Pond Snake'; const nj = document.getElementById('nojs'); if (nj) nj.innerHTML = translate(nj.innerHTML); }
    const markup = document.getElementById('ps-markup'), game = document.getElementById('ps-game');
    document.body.insertAdjacentHTML('afterbegin', translate(markup.textContent));
    const s = document.createElement('script'); s.textContent = translate(game.textContent); document.body.appendChild(s);
    try { a.ready(); } catch (e) {}
  }

  const api = {
    store, start, translate, KEYS,
    get lang() { return lang; },
    get platform() { return BUILD.platform; },
    canShare() { try { return !!A().canShare(); } catch (e) { return false; } },
    share(o) { try { A().share(o); } catch (e) {} },
    gameplay(on) { if (on === playing) return; playing = on; try { A().gameplay(on); } catch (e) {} },
    onPause(cb) { pauseCbs.push(cb); }, onResume(cb) { resumeCbs.push(cb); },
    _pause() { pauseCbs.forEach(f => { try { f(); } catch (e) {} }); },
    _resume() { resumeCbs.forEach(f => { try { f(); } catch (e) {} }); },
    flush(hard) { try { A().flush(hard); } catch (e) {} },
  };
  window.addEventListener('pagehide', () => api.flush(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) api.flush(true); });
  return api;
})();
</script>

  frog: FROG_SRC,   // лягушка (смотрит на зрителя), квадратная картинка
  frogOutline: FROG_OUTLINE_SRC,
  frogHop: FROG_HOP_SRC,
  snakeHead: null,  // голова змейки, смотрит вправо, квадратная картинка
  pond: null,       // весь фон пруда с бортиком, квадратная картинка

  b_snail: BOOST_SRC.snail, b_dragonfly: BOOST_SRC.dragonfly, b_helmet: BOOST_SRC.helmet, b_coin: BOOST_SRC.coin, // бусты; null — рисуются кодом // рамка пруда (камни, трава, мостик) — картинка из ChatGPT, WebP 111 КБ

/* =========================================================
   3. ИГРОВАЯ ЛОГИКА — без рисования
   ========================================================= */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

function createGame(cfg) {
  const s = {};
  const B = cfg.boosts, rnd = (a, b) => a + Math.random() * (b - a);
  const taken = (x, y) => s.snake.some(p => p.x === x && p.y === y) || (s.food && s.food.x === x && s.food.y === y) || (s.items || []).some(i => i.x === x && i.y === y);
  function placeItem(kind) {
    const h = s.snake[0], [dx, dy] = DIRS[s.dir], pool = [];
    const nearCorner = (x, y) => ((x < 2 || x >= cfg.gridW - 2) && (y < 2 || y >= cfg.gridH - 2));
    for (let y = 0; y < cfg.gridH; y++) for (let x = 0; x < cfg.gridW; x++) {
      if (taken(x, y) || nearCorner(x, y)) continue;
      if (Math.abs(x - h.x) + Math.abs(y - h.y) < B.minDistFromHead) continue;
      let ahead = false; for (let k = 1; k <= 4; k++) if (x === h.x + dx * k && y === h.y + dy * k) ahead = true;
      if (!ahead) pool.push({ x, y });
    }
    if (!pool.length) return false;
    const c = pool[Math.floor(Math.random() * pool.length)];
    s.items.push({ id: ++s.itemSeq, kind, x: c.x, y: c.y, ttl: kind === 'coin' ? B.coin.lifeMs : B.lifeMs, life: kind === 'coin' ? B.coin.lifeMs : B.lifeMs });
    return true;
  }
  function pickBoost() {
    const w = { ...B.weights }; if (s.shield) w.helmet = 0;
    const tot = Object.values(w).reduce((a, b) => a + b, 0); let r = Math.random() * tot;
    for (const k in w) { r -= w[k]; if (r < 0) return k; } return 'snail';
  }
  // множитель длительности шага: плавный разгон в начале эффекта и плавный возврат в конце
  function speedMul() {
    const e = s.effect; if (!e) return 1;
    const k = Math.max(0, Math.min(1, (e.total - e.left) / B.rampMs, e.left / B.rampMs));
    return 1 + (B[e.kind].speed - 1) * k;
  }
  const curStepMs = () => s.stepMs * speedMul();
  function hopWait() { const H = cfg.hop; return Math.max(H.minWaitMs, H.waitMs - (s.frogs - H.fromFrogs) * H.fasterPerFrog); }
  function tryHop() {
    const H = cfg.hop, f = s.food, h = s.snake[0], [dx, dy] = DIRS[s.dir], pool = [];
    if (Math.abs(h.x - f.x) + Math.abs(h.y - f.y) <= 2) return;   // уж уже рядом — не убегает из-под носа (честно)
    const nearCorner = (x, y) => ((x < 2 || x >= cfg.gridW - 2) && (y < 2 || y >= cfg.gridH - 2));
    for (let y = f.y - H.dist[1]; y <= f.y + H.dist[1]; y++) for (let x = f.x - H.dist[1]; x <= f.x + H.dist[1]; x++) {
      const d = Math.abs(x - f.x) + Math.abs(y - f.y);
      if (d < H.dist[0] || d > H.dist[1] || x < 0 || y < 0 || x >= cfg.gridW || y >= cfg.gridH || nearCorner(x, y)) continue;
      if (s.snake.some(p => p.x === x && p.y === y) || (s.items || []).some(i => i.x === x && i.y === y)) continue;
      if (Math.abs(x - h.x) + Math.abs(y - h.y) < H.safeFromHead) continue;
      let ahead = false; for (let k = 1; k <= 2; k++) if (x === h.x + dx * k && y === h.y + dy * k) ahead = true;
      if (!ahead) pool.push({ x, y });
    }
    if (!pool.length) { s.foodAge = 0; return; }
    const to = pool[Math.floor(Math.random() * pool.length)];
    s.hop = { from: { x: f.x, y: f.y }, to, n: (s.hop ? s.hop.n : 0) + 1 }; s.food = to; s.foodAge = 0;
  }
  function tick(dt) {
    if (s.food && s.frogs >= cfg.hop.fromFrogs) { s.foodAge = (s.foodAge || 0) + dt; if (s.foodAge >= hopWait()) tryHop(); }
    if (s.effect) { s.effect.left -= dt; if (s.effect.left <= 0) s.effect = null; }
    for (const i of s.items) i.ttl -= dt;
    s.items = s.items.filter(i => i.ttl > 0);
    if (!s.items.some(i => i.kind !== 'coin')) { s.boostIn -= dt; if (s.boostIn <= 0) s.boostIn = placeItem(pickBoost()) ? rnd(B.spawnMinMs, B.spawnMaxMs) : 0; }
    if (!s.items.some(i => i.kind === 'coin')) { s.coinIn -= dt; if (s.coinIn <= 0) s.coinIn = placeItem('coin') ? rnd(B.coin.spawnMinMs, B.coin.spawnMaxMs) : 0; }
  }
  function placeFrog() {
    const free = [], corner = [];
    const nearCorner = (x, y) => ((x < 2 || x >= cfg.gridW - 2) && (y < 2 || y >= cfg.gridH - 2)); // камыш и кувшинки
    for (let y = 0; y < cfg.gridH; y++)
      for (let x = 0; x < cfg.gridW; x++)
        if (!s.snake.some(p => p.x === x && p.y === y) && !(s.items || []).some(i => i.x === x && i.y === y)) (nearCorner(x, y) ? corner : free).push({ x, y });
    const pool = free.length ? free : corner;
    s.food = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  }
  function reset() {
    const mid = Math.floor(cfg.gridW / 2), midY = Math.floor(cfg.gridH / 2);
    s.snake = [];
    for (let i = 0; i < cfg.startLength; i++) s.snake.push({ x: mid - 1 - i, y: midY });
    s.trail = [1, 2, 3].map(k => ({ x: mid - cfg.startLength - k, y: midY })); // клетки, которые хвост только что покинул — нужны для плавной отрисовки
    s.dir = 'right'; s.queue = []; s.grow = 0;
    s.frogs = 0; s.score = 0; s.steps = 0; s.stepMs = cfg.startSpeedMs * (cfg.speedScale || 1); s.over = false;
    s.foodAge = 0; s.hop = null; s.items = []; s.itemSeq = 0; s.effect = null; s.shield = false; s.coins = 0;
    s.boostIn = B.firstDelayMs; s.coinIn = B.coin.firstDelayMs;
    placeFrog();
  }
  function turn(dir) {
    const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
    if (dir === last || dir === OPPOSITE[last] || s.queue.length >= 2) return;
    s.queue.push(dir);
  }
  function step() {
    if (s.over) return { type: 'none' };
    tick(curStepMs());
    if (s.queue.length) s.dir = s.queue.shift();
    const [dx, dy] = DIRS[s.dir], nw = cfg.gridW, nh = cfg.gridH;
    let x = s.snake[0].x + dx, y = s.snake[0].y + dy;
    if (cfg.wrapWalls) { x = (x + nw) % nw; y = (y + nh) % nh; }

function roundRectPath(x, y, w, h, r) {
  const segs = [], hp = Math.PI / 2;
  segs.push({ len: w - 2 * r, at: t => ({ x: x + r + t, y, a: 0 }) });
  segs.push({ len: r * hp, at: t => { const a = -hp + t / r; return { x: x + w - r + Math.cos(a) * r, y: y + r + Math.sin(a) * r, a: a + hp }; } });
  segs.push({ len: h - 2 * r, at: t => ({ x: x + w, y: y + r + t, a: hp }) });
  segs.push({ len: r * hp, at: t => { const a = t / r; return { x: x + w - r + Math.cos(a) * r, y: y + h - r + Math.sin(a) * r, a: a + hp }; } });
  segs.push({ len: w - 2 * r, at: t => ({ x: x + w - r - t, y: y + h, a: Math.PI }) });
  segs.push({ len: r * hp, at: t => { const a = hp + t / r; return { x: x + r + Math.cos(a) * r, y: y + h - r + Math.sin(a) * r, a: a + hp }; } });
  segs.push({ len: h - 2 * r, at: t => ({ x, y: y + h - r - t, a: -hp }) });
  segs.push({ len: r * hp, at: t => { const a = Math.PI + t / r; return { x: x + r + Math.cos(a) * r, y: y + r + Math.sin(a) * r, a: a + hp }; } });
  const total = segs.reduce((s, q) => s + q.len, 0);
  return { total, at(d) { d = ((d % total) + total) % total; for (const q of segs) { if (d <= q.len) return q.at(d); d -= q.len; } return segs[0].at(0); } };
}

/* Горбатый деревянный мостик, вид чуть сбоку (как на референсе), без обводок.
   x, y — середина пролёта на уровне берега; мостик перекинут вдоль верхнего края пруда. */
function drawBridge(g, x, y, c0) {
  const c = c0 * .8, L = c * 3.3, H = c * .55, D = c * .85, T = c * .2, N = 11;
  const arch = u => -H * Math.sin(Math.PI * u);           // u: 0..1 вдоль пролёта
  const X = u => x - L / 2 + L * u;
  g.save();
  g.fillStyle = 'rgba(18,70,92,.16)'; ellipse(g, x, y + T * .6, L * .46, c * .16); g.fill();   // мягкая тень на камни
  // торец настила (толщина) — под передним краем
  g.fillStyle = '#8c5631'; g.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40; g.lineTo(X(u), y + arch(u)); }
  for (let i = 40; i >= 0; i--) { const u = i / 40; g.lineTo(X(u), y + arch(u) + T); }
  g.closePath(); g.fill();
  // доски настила: между задним (выше) и передним краем
  for (let k = 0; k < N; k++) {
    const u0 = k / N, u1 = (k + 1) / N, gap = .01;
    const shade = .5 + .5 * Math.cos(Math.PI * ((u0 + u1) / 2 - .5) * 2);
    g.fillStyle = k % 2 ? `rgb(${200 + 30 * shade},${135 + 25 * shade},${80 + 15 * shade})` : `rgb(${190 + 30 * shade},${126 + 25 * shade},${74 + 15 * shade})`;
    g.beginPath();
    g.moveTo(X(u0 + gap), y + arch(u0 + gap) - D); g.lineTo(X(u1 - gap), y + arch(u1 - gap) - D);
    g.lineTo(X(u1 - gap), y + arch(u1 - gap)); g.lineTo(X(u0 + gap), y + arch(u0 + gap)); g.closePath(); g.fill();
  }
  // перила: задние (тоньше, за настилом) и передние
  const rail = (dy, h, post, top, posts) => {
    for (const u of posts) {
      const px = X(u), py = y + arch(u) + dy;
      g.fillStyle = post; rrect(g, px - c * .09, py - h, c * .18, h + c * .06, c * .06); g.fill();
      g.fillStyle = top; rrect(g, px - c * .1, py - h - c * .06, c * .2, c * .12, c * .06); g.fill();
    }
    g.strokeStyle = top; g.lineWidth = c * .13; g.lineCap = 'round'; g.beginPath();
    for (let i = 0; i <= 40; i++) { const u = .04 + .92 * i / 40; g.lineTo(X(u), y + arch(u) + dy - h); }
    g.stroke();
    g.strokeStyle = 'rgba(255,235,200,.45)'; g.lineWidth = c * .04; g.beginPath();
    for (let i = 4; i <= 36; i++) { const u = .04 + .92 * i / 40; g.lineTo(X(u), y + arch(u) + dy - h - c * .03); }
    g.stroke();
  };
  rail(-D, c * .3, '#a8693a', '#d39a5f', [.04, .5, .96]);
  g.restore();
  return () => { g.save(); rail(c * .02, c * .34, '#a1622f', '#e0a96b', [.04, .5, .96]); g.restore(); };   // передние перила рисуем поверх
}

/* Мягкий кустик травы: веер округлых листьев, тёмных у основания и светлых к кончику */
function drawTuft(g, x, y, s, seed, flower) {
  const r = rng(seed), n = 5 + Math.floor(r() * 3);
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(20,80,60,.22)'; ellipse(g, 0, s * .08, s * .62, s * .16); g.fill();
  for (let k = 0; k < n; k++) {
    const t = n === 1 ? 0 : k / (n - 1) - .5, a = t * 1.9 + (r() - .5) * .25, len = s * (.75 + r() * .4) * (1 - Math.abs(t) * .35), w = s * (.2 + r() * .07);
    g.save(); g.rotate(a);
    const grd = g.createLinearGradient(0, 0, 0, -len); grd.addColorStop(0, '#3c9a45'); grd.addColorStop(1, k % 2 ? '#9be06a' : '#86d45e');
    g.fillStyle = grd; g.beginPath();
    g.moveTo(-w * .35, 0);
    g.bezierCurveTo(-w * 1.1, -len * .35, -w * .7, -len * .9, 0, -len);
    g.bezierCurveTo(w * .7, -len * .9, w * 1.1, -len * .35, w * .35, 0);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.18)'; ellipse(g, -w * .2, -len * .62, w * .16, len * .2); g.fill();
    g.restore();
  }
  if (flower) {
    const fx = (r() - .5) * s * .5, fy = -s * (.45 + r() * .25), col = r() < .5 ? '#ffffff' : '#ffb7c9', pr = s * .1;
    g.fillStyle = col; for (let q = 0; q < 5; q++) { const a2 = q * 1.2566 - 1.57; circle(g, fx + Math.cos(a2) * pr, fy + Math.sin(a2) * pr, pr * .85); g.fill(); }
    g.fillStyle = '#ffd65a'; circle(g, fx, fy, pr * .6); g.fill();
  }
  g.restore();
}

  ['reeds', -.55, 6.6, 2.1, -.05], ['lily', -5.8, .2, .45, 4],

function drawDecor(g, t) {

  const L0 = ox - F, R0 = ox + fieldW + F, T0 = oy - F, B0 = oy + fieldH + F;

function frameSeq(cuts, span, k) {
  const tiles = []; for (let i = 0; i < cuts.length - 1; i++) tiles.push([cuts[i], cuts[i + 1]]);
  const out = []; let len = 0, best = null;
  for (let i = 0; i < 200; i++) {
    const t = tiles[i % tiles.length]; out.push(t); len += (t[1] - t[0]) * k;
    const dev = Math.abs(span / len - 1); if (!best || dev < best.dev) best = { n: out.length, len, dev };
    if (len > span * 1.6) break;
  }
  return { tiles: out.slice(0, best.n), scale: span / best.len };
}

function frameTile(sx, sy, sw, sh, vertical) {

  let cv = frameTileCache.get(key); if (cv) return cv;

}

const stoneImgs = STONE_SRC.map(src => { const im = new Image(); im.src = src; im.onload = () => { if (typeof R !== 'undefined' && R.W) buildStaticLayer(); }; return im; });
// крупные камни вразброс поверх повторяющейся полосы — чтобы бортик не выглядел однообразным
function drawTopStamps(g, s0, s1, ty0, k) {
  const rnd = rng(1234 + Math.round(s1 - s0)), n = stoneImgs.length, base = ty0 + 229 * k;   // 229 — линия, на которой стоят камни
  if (!stoneImgs.every(im => im.complete && im.naturalWidth)) return;
  let x = s0 + (30 + rnd() * 70) * k, last = -1;
  for (let guard = 0; guard < 60; guard++) {
    let i = Math.floor(rnd() * n); if (i === last && rnd() < .7) i = (i + 1) % n; last = i;
    const im = stoneImgs[i], sc = (i === 0 ? .78 : .9) + rnd() * .4, w = im.naturalWidth * k * sc, h = im.naturalHeight * k * sc;
    if (x + w > s1 - 20 * k) break;
    g.save(); g.translate(x + w / 2, base);
    if (rnd() < .5) g.scale(-1, 1);                               // половина камней отзеркалена
    g.fillStyle = 'rgba(40,60,40,.18)'; ellipse(g, 0, -h * .06, w * .5, h * .14); g.fill();   // мягкая тень у основания
    g.drawImage(im, -w / 2, -h, w, h); g.restore();
    x += w + (40 + rnd() * 160) * k;
  }
}
function drawFrame(g) {

  const hband = (sy0, sy1, ty0, cuts, th) => {   // th — высота на экране (верх/низ стыка ровно на пикселе)
    const a = cuts[0], z = cuts[cuts.length - 1], h = sy1 - sy0;
    const s0 = sidesOff ? 0 : X0 + a * k, s1 = sidesOff ? R.W : X1 - (F_.w - z) * k, span = s1 - s0;
    if (!sidesOff) g.drawImage(img, 0, sy0, a, h, X0, ty0, a * k, th);
    if (span > 0) { let x = s0; const { tiles, scale } = frameSeq(cuts, span, k), ks = k * scale;
      for (const t of tiles) { const w = (t[1] - t[0]) * ks;
        g.drawImage(frameTile(t[0] - f, sy0, t[1] - t[0] + f, h, false), x - f * ks, ty0, w + f * ks + .5, th); x += w; } }
    if (sy0 === 0) drawTopStamps(g, s0, s1, ty0, k);   // только верхний бортик

  };

    g.drawImage(img, sx0, ys, w, a - ys, tx0, J0, w * k, s0 - J0);

    g.drawImage(frameTile(sx0, z - f, w, ye - z + f, true), tx0, s1 - f * k, w * k, J1 - (s1 - f * k));
  };

function buildStaticLayer() {

  }
  tuftSpots.sort((a, b) => a.y - b.y).forEach(t => drawTuft(g, t.x, t.y, t.s, t.seed, t.fl));

    d += len * (1.45 + rand() * .25);

const ease = t => 1 - Math.pow(1 - t, 3);

function drawRiders(g, sp, t, dead) {
  const c = R.c, u0 = sp.u0, L = sp.L;

    const rd = riders[k];

    let x = seat.x, y = seat.y - c * .14 + bob, sc = 1, alpha = 1, rot = 0;

function die(win) {

let lastSnap = null, lastEvent = '', lastStepT = 0;
/* «Продолжить»: храним состояние последних шагов, после столкновения отматываем назад */
let stepHistory = [], continuesLeft = 0;
function continueGame(paidWithStars = false) {
  if (mode !== 'over' || continuesLeft <= 0 || !stepHistory.length || (!paidWithStars && wallet < CONFIG.continueCost)) return;
  if (!paidWithStars) { wallet -= CONFIG.continueCost; store.set(KEY_COINS, wallet); srvSpend(CONFIG.continueCost); } // плата за продолжение монетками (в Телеграме — и на сервере)
  const i = Math.max(0, stepHistory.length - CONFIG.rewindSteps);
  const snap = JSON.parse(stepHistory[i]), keepCoins = game.state.coins;
  Object.assign(game.state, snap); game.state.coins = keepCoins;   // монеты за забег не теряются при отмотке
  game.state.over = false; game.state.queue = [];   // v0.60: раньше эта строка случайно была в комментарии
  game.state.itemSeq = Math.max(game.state.itemSeq, ...[...collectedIds].map(Number).filter(Number.isFinite), ...game.state.items.map(i => i.id));   // v0.64: номера новых предметов — только вперёд
  game.state.items = game.state.items.filter(i => !collectedIds.has(i.id)); // монетки не собрать второй раз
  stepHistory.length = i;
  continuesLeft--;
  riders = riders.slice(0, game.state.frogs).map(r => ({ ...r, born: -1e9 }));
  popups = []; ui.score.textContent = game.state.score; frogBornAt = performance.now(); waitReason = '';
  ui.overlay.hidden = true; sound.start(); haptic('medium');
  if (ctl === 'tilt') tilt.calibrate();
  waitFirst = true; mode = 'play'; acc = 0; alpha = 1; lastT = performance.now(); setPauseLabel();
}
function onItem(ev, t) {
  addRipple(ev.at.x, ev.at.y, 'splash', t);
  if (collectedIds.has(ev.id)) return;   // этот предмет уже засчитан (шаг пересчитан или отмотан)
  collectedIds.add(ev.id);
  if (ev.kind === 'coin') {
    wallet += CONFIG.boosts.coin.value; store.set(KEY_COINS, wallet); srvEarn(CONFIG.boosts.coin.value);
    popups.push({ x: ev.at.x, y: ev.at.y, born: t, text: '+1', color: '#e39a12', drop: '#ffe37a' });
    sound.coin(); haptic('light'); return;
  }
  const label = { snail: 'Медленнее', dragonfly: 'Очки ×2', helmet: 'Шлем!' }[ev.kind];
  popups.push({ x: ev.at.x, y: ev.at.y, born: t, text: label, color: ev.kind === 'snail' ? '#e8795a' : '#1f97ee' });
  sound.boost(ev.kind); haptic('medium');
}
function doStep(t) {
  steerAuto();
  const st = game.state;
  lastSnap = JSON.stringify(st);   // всё состояние партии, включая бусты и щит
  lastStepT = t;
  stepHistory.push(lastSnap); if (stepHistory.length > 30) stepHistory.shift();
  const ev = game.step();
  lastEvent = ev.type;
  const hd = st.snake[1] || st.snake[0];
  if (ev.type === 'move' && !reduceMotion) addRipple(hd.x, hd.y, 'wake', t);
  if (ev.type === 'ate') addRipple(ev.at.x, ev.at.y, 'splash', t);
  if (ev.type === 'dead') addRipple(st.snake[0].x, st.snake[0].y, 'bump', t);
  if (ev.type === 'item') onItem(ev, t);
  if (ev.type === 'saved') {          // пузырь лопнул: уж стоит и ждёт, куда плыть
    const h = st.snake[0]; addRipple(h.x, h.y, 'splash', t);
    popups.push({ x: h.x, y: h.y, born: t, text: 'Шлем спас!', color: '#e58a12' }); flyHelmet(t);
    sound.pop(); haptic('medium');
    waitFirst = true; waitReason = 'saved'; acc = 0; alpha = 1;
  }
  if (ev.type === 'ate' || ev.type === 'win') {
    riders.push({ born: t, from: ev.at });
    popups.push({ x: ev.at.x, y: ev.at.y, born: t, text: '+' + (ev.pts || 1), color: ev.pts > 1 ? '#1d9fc0' : undefined });
    frogBornAt = t;
    ui.score.textContent = st.score;
    sound.catch(st.frogs); haptic('light'); setTimeout(() => sound.plop(), 400);

let waitFirst = false;
function loop(t) {
  if (dbg.on) dbg.frame(t);
  syncPadCur();
  if (!isMobileNow()) centerCards(); else fitOverlay();   // окна могли только что открыться
  if (mode === 'play' && waitFirst) { acc = 0; alpha = 1; }
  else if (mode === 'play') {
    acc += Math.min(t - lastT, 250); // скорость всегда ровная — никаких ускорений
    while (mode === 'play' && !waitFirst && acc >= game.curStepMs()) { acc -= game.curStepMs(); doStep(t); }
    if (mode === 'play' && waitFirst) { acc = 0; alpha = 1; }
    else if (mode === 'play') alpha = reduceMotion ? 1 : Math.min(1, acc / game.curStepMs());
  }
  lastT = t;
  render(t);
  requestAnimationFrame(loop);
}

/* Поздний поворот: если кнопку нажали в самом начале шага, шаг пересчитывается
   с новым направлением. Голова в этот момент почти не сдвинулась, так что подмены не видно. */
function tryLateTurn(dir) {
  if (!lastSnap || lastEvent !== 'move' || alpha >= CONFIG.lateTurnWindow) return false;   // v0.64: шаг с подбором предмета не пересчитываем
  const st = game.state, snap = JSON.parse(lastSnap);
  if (st.queue.length || snap.queue.length || dir === snap.dir || dir === OPPOSITE[snap.dir]) return false;
  Object.assign(st, snap);
  st.queue = [dir]; stepHistory.pop(); // шаг пересчитывается — старую запись убираем
  doStep(lastStepT);
  return true;
}

function input(dir, auto = false) {
  if (!auto) autoTarget = null;          // любое ручное управление отменяет автопилот
  sound.unlock();
  if (!ui.panel.hidden || !$('ctlPanel').hidden || !$('sizePanel').hidden) return;
  if (mode === 'over') return;                      // v0.66: на «Плюх!» партию начинают только кнопки — иначе терялось «Продолжить»
  if (mode === 'menu') { if (savedRun()) return; start(); }   // v0.66: с сохранённой партией стрелка не стирает её
  if (mode !== 'play') return;
  if (waitFirst) { // первый жест: трогаемся сразу в выбранную сторону, даже назад
    const st = game.state;
    if (dir === OPPOSITE[st.dir]) {
      // назад — плавная петля: шаг в сторону, где больше места, затем в нужную сторону
      const h = st.snake[0], horiz = st.dir === 'left' || st.dir === 'right';
      const pref = horiz ? (h.y < CONFIG.gridH / 2 ? 'down' : 'up') : (h.x < CONFIG.gridW / 2 ? 'right' : 'left');
      const body = st.grow > 0 ? st.snake : st.snake.slice(0, -1);   // v0.66: боковая клетка должна быть свободна — иначе петля убивала
      const free = d => { const [dx, dy] = DIRS[d], x = h.x + dx, y = h.y + dy; return x >= 0 && y >= 0 && x < CONFIG.gridW && y < CONFIG.gridH && !body.some(p => p.x === x && p.y === y); };
      const side = [pref, OPPOSITE[pref]].find(free);
      st.queue = side ? [side, dir] : [];   // обе стороны заняты — плывём прямо
    } else if (dir !== st.dir) game.turn(dir);
    waitFirst = false; waitReason = ''; lastT = performance.now();
    doStep(lastT); acc = 0; alpha = 0; // сразу делаем первый шаг: картинка продолжает движение с того места, где уж стоял

  if (inTelegram && TG.platform && !/^(android|ios)$/.test(TG.platform)) return false;   // Телеграм на компьютере

/* v0.60: пульт. Нажатие в любом месте сектора поворачивает; палец можно вести по кругу, не отрывая.
